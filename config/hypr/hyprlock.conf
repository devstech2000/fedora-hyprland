$font = Noto Sans Mono

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 2, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 8%, 3%
    outline_thickness = 1.5

    inner_color = rgb(36, 39, 58)
    outer_color = rgb(138, 173, 244)
    check_color = rgb(166, 218, 149)
    fail_color = rgb(237, 135, 150)

    font_color = rgb(202, 211, 245)
    fade_on_empty = false
    rounding = 12

    font_family = $font
    placeholder_text = Password...
    fail_text = Authentication failed

    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}
